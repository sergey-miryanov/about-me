    <line x1="388" y1="60" x2="438" y2="60"/>
    <line x1="530" y1="60" x2="580" y2="60"/>
  </g>
  <!-- nodes -->
  <g stroke-width="3" fill="#d0cece" stroke="#afabab">
    <circle cx="58"  cy="60" r="46"/>
    <circle cx="200" cy="60" r="46"/>
    <circle cx="342" cy="60" r="46"/>
    <circle cx="484" cy="60" r="46"/>
    <circle cx="626" cy="60" r="46"/>
  </g>
  <g font-family="Fira Sans, Arial, sans-serif" font-size="46" fill="#000" text-anchor="middle">
    <text x="58"  y="60" dy=".35em">L</text>
    <text x="200" y="60" dy=".35em">D</text>
    <text x="342" y="60" dy=".35em">C</text>
    <text x="484" y="60" dy=".35em">A</text>
